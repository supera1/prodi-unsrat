# The admin: included in the server of port 8081, or of 8443 with HTTPS_DI_VM=1 (prodi.conf). Only UNSRAT's
# network gets through (the admin checks the address itself as well, app.py).
client_max_body_size 40m;                 # the admin's own limit (app.py MAX_CONTENT_LENGTH): photos, PDFs, www's data
include /etc/nginx/prodi/admin-ip.conf;   # allow <each network of ADMIN_IP_BOLEH>; deny all;

resolver 127.0.0.11 valid=30s ipv6=off;   # Docker's DNS: "admin" is found also when it starts later
set $admin http://admin:8791;

location / {
    proxy_pass $admin;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;      # replace, never append to what the visitor sent
    proxy_set_header X-Forwarded-Proto $scheme;
    include /etc/nginx/prodi/admin-awalan.conf;         # X-Forwarded-Prefix from ADMIN_AWALAN (never the visitor's)
    proxy_read_timeout 300s;              # an upload is checked, and a photo resized, before the answer
    proxy_send_timeout 300s;
}
