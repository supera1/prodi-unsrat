# prodi.unsrat.ac.id (docs/deploy.md). Included inside http { } of the image's nginx.conf.
# Port 80: the programme sites, only the volume "publik". Port 8081: the admin, only from ADMIN_IP_BOLEH.
# HTTPS is ended in front of this container (a load balancer: the default), or here with HTTPS_DI_VM=1: then 443
# serves the sites and 8443 the admin, and 80 / 8081 only redirect to them (45-prodi-https.sh).

server_tokens off;
absolute_redirect off;                    # "Location: /path": the port and host outside the container are not known here
charset utf-8;
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/css text/javascript application/javascript application/json image/svg+xml application/xml
           application/rss+xml text/xml text/plain;    # HTML is always compressed when gzip is on
client_max_body_size 1m;                  # the sites take no uploads; the admin has its own limit (lokasi-admin.conf)

# styles and pictures are loaded with ?v=<content hash> (bangun.py): a year when the address has it, a day otherwise
map $arg_v $cache_aset {
    ""      "public, max-age=86400";
    default "public, max-age=31536000, immutable";
}

# the visitor's own address when a load balancer or reverse proxy sits in front (PROKSI_DEPAN, 40-prodi-jaringan.sh)
include /etc/nginx/prodi/real-ip.conf;

server {
    listen 80 default_server;
    server_name _;

    location = /sehat {                   # health check of the container and of a load balancer
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location ^~ /.well-known/acme-challenge/ {    # certificates on the VM (HTTPS_DI_VM=1, docs/deploy.md)
        root /srv/acme;
        default_type text/plain;
    }
    include /etc/nginx/prodi/port-80.conf;        # the sites, or with HTTPS_DI_VM=1 a redirect to https
}

server {
    listen 8081;
    server_name _;
    include /etc/nginx/prodi/port-8081.conf;      # the admin, or with HTTPS_DI_VM=1 a redirect to https
}
