# The programme sites: included in the server of port 80, or of 443 with HTTPS_DI_VM=1 (prodi.conf). Only the volume
# "publik", which the admin container builds: data, history, accounts and code are never in it.
root /srv/publik;
autoindex off;
error_page 404 /404.html;                 # the platform's own page

# old slugs of the programmes, permanently redirected to the current one: bangun.py writes them, 50-prodi-pantau.sh
# copies only lines of that one shape and reloads Nginx when they change
include /etc/nginx/prodi/slug-lama.conf;

location ~ /\. { deny all; }              # never a dotfile (nothing like it is published)

location ~* \.svg$ {                      # an SVG opened by itself may not run anything (logos are cleaned at upload too)
    limit_except GET HEAD { deny all; }
    include /etc/nginx/prodi-tetap/header-keamanan.conf;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src data:" always;
    add_header Cache-Control "public, max-age=86400" always;
}

# a folder typed without its "/" (s1informatika -> s1informatika/), relative so that it also works under a path
# prefix of a load balancer; Nginx's own redirect would start at the root
location ~ "/(?<folder>[^/.]+)$" {
    limit_except GET HEAD { deny all; }
    include /etc/nginx/prodi-tetap/header-keamanan.conf;
    add_header Cache-Control "no-cache" always;
    if (-d $request_filename) { return 301 $folder/; }
}

location / {                              # pages, robots.txt, sitemap.xml, rss.xml, <slug>/warna.css
    limit_except GET HEAD { deny all; }
    include /etc/nginx/prodi-tetap/header-keamanan.conf;
    add_header Cache-Control "no-cache" always;     # always asked again (304 when unchanged)
}

location /aset/ {                         # styles and the UNSRAT emblem
    limit_except GET HEAD { deny all; }
    include /etc/nginx/prodi-tetap/header-keamanan.conf;
    add_header Cache-Control $cache_aset always;
}

location /unggahan/ {                     # photos, logos and PDFs of the programmes: every upload has a new name
    limit_except GET HEAD { deny all; }
    include /etc/nginx/prodi-tetap/header-keamanan.conf;
    add_header Cache-Control "public, max-age=604800" always;
}
